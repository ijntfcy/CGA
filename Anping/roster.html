<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>安漁班表</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');
    body {
      font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
    }
    .blur-backdrop {
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    input:focus, button:focus { outline: none; }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between">

  <!-- 頂部導覽列 -->
  <header id="appHeader" class="hidden sticky top-0 z-30 bg-white/90 blur-backdrop border-b border-slate-200/80 px-4 py-3 transition-all duration-200">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center text-blue-600 border border-blue-100 shadow-sm">
          <i class="fa-solid fa-shield-halved text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-slate-800 text-lg leading-tight">安漁班表</h1>
          <p class="text-xs text-slate-400 font-medium">勤務人員</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <span id="connStatus" class="hidden md:inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-600 border border-emerald-200">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>已連線
        </span>
        <button onclick="openPersonnelModal()" class="px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 text-sm font-medium transition flex items-center gap-1.5">
          <i class="fa-solid fa-users text-xs"></i><span class="hidden sm:inline">人員</span>名冊
        </button>
        <button onclick="logout()" class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-red-50 text-slate-600 hover:text-red-600 text-sm font-medium transition flex items-center gap-1.5 border border-slate-200">
          <span>登出</span><i class="fa-solid fa-right-from-bracket text-xs"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-5xl mx-auto w-full p-4 sm:p-6 flex-1">

    <!-- 登入頁面 -->
    <div id="loginSection" class="min-h-[80vh] flex items-center justify-center">
      <div class="w-full max-w-md bg-white rounded-3xl p-8 border border-slate-200/80 shadow-xl shadow-slate-200/50 text-center space-y-6">
        <div class="w-16 h-16 bg-blue-50 rounded-2xl flex items-center justify-center mx-auto text-blue-600 border border-blue-100 shadow-sm">
          <i class="fa-solid fa-lock text-2xl"></i>
        </div>
        <div>
          <h2 class="text-2xl font-bold text-slate-800">安漁班表</h2>
          <p class="text-slate-400 text-sm mt-1">勤務人員</p>
        </div>
        <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">驗證密碼</label>
            <input type="password" id="passwordInput" placeholder="請輸入密碼" required
              class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition text-center text-lg tracking-widest font-semibold text-slate-700 bg-slate-50/50">
          </div>
          <button type="submit" id="loginBtn"
            class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg shadow-blue-500/20 transition flex items-center justify-center gap-2">
            <span>進入班表</span>
          </button>
        </form>
        <p class="text-xs text-slate-400 font-medium">離開頁面會清除登入狀態；切換其他 App 超過 1 分鐘會自動登出</p>
      </div>
    </div>

    <!-- 主要班表視圖區塊 -->
    <div id="appSection" class="hidden space-y-6">

      <!-- 頁籤與工具列 -->
      <div class="bg-white p-3 sm:p-4 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-4">
        <!-- 班別選擇 -->
        <div class="flex bg-slate-100 p-1 rounded-xl gap-1">
          <button onclick="selectShift('第一班')" id="tab-第一班" class="shift-tab flex-1 sm:flex-initial px-5 py-2 rounded-lg text-sm font-semibold transition">第一班</button>
          <button onclick="selectShift('第二班')" id="tab-第二班" class="shift-tab flex-1 sm:flex-initial px-5 py-2 rounded-lg text-sm font-semibold transition">第二班</button>
          <button onclick="selectShift('第三班')" id="tab-第三班" class="shift-tab flex-1 sm:flex-initial px-5 py-2 rounded-lg text-sm font-semibold transition">第三班</button>
        </div>

        <!-- 模式切換與刷新 -->
        <div class="flex items-center justify-end gap-2">
          <div class="bg-slate-100 p-1 rounded-xl flex">
            <button onclick="setViewMode('view')" id="mode-view" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition">
              <i class="fa-regular fa-eye"></i> 班表
            </button>
            <button onclick="setViewMode('edit')" id="mode-edit" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition">
              <i class="fa-solid fa-pen"></i> 編輯
            </button>
          </div>
          <button onclick="fetchData()" id="refreshBtn" title="重新整理" class="p-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 active:bg-slate-100 transition">
            <i class="fa-solid fa-arrows-rotate text-sm"></i>
          </button>
        </div>
      </div>

      <!-- 標題與來源資訊 -->
      <div class="flex items-center justify-between px-1">
        <div>
          <span class="text-xs font-bold uppercase tracking-wider text-blue-600">CURRENT SHIFT</span>
          <h2 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
            <span id="currentShiftTitle">第一班</span>
            <span id="modeBadge" class="text-xs font-normal px-2.5 py-0.5 rounded-full bg-slate-200 text-slate-600">勤務配置</span>
          </h2>
        </div>
        <div class="text-xs text-slate-400 font-medium">
          資料來源：不能說的秘密
        </div>
      </div>

      <!-- 班表卡片檢視 (View Mode) -->
      <div id="viewContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <!-- 由 JS 動態繪製 -->
      </div>

      <!-- 編輯模式容器 (Edit Mode) -->
      <div id="editContainer" class="hidden space-y-4">
        <form onsubmit="handleSaveDuties(event)" class="space-y-4">
          <div id="editFields" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- 由 JS 動態產生輸入框 -->
          </div>
          <div class="flex justify-end pt-2">
            <button type="submit" id="saveBtn" class="w-full sm:w-auto px-8 py-3.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold rounded-xl shadow-lg shadow-blue-500/20 transition flex items-center justify-center gap-2">
              <i class="fa-solid fa-floppy-disk"></i>
              <span>儲存</span>
            </button>
          </div>
        </form>
      </div>

    </div>
  </main>

  <!-- 人員名冊 Modal -->
  <div id="personnelModal" class="hidden fixed inset-0 z-50 bg-slate-900/40 blur-backdrop flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-lg rounded-3xl border border-slate-200 shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
        <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">
          <i class="fa-solid fa-address-book text-blue-600"></i> 人員名冊
        </h3>
        <button onclick="closePersonnelModal()" class="text-slate-400 hover:text-slate-600 p-2 rounded-lg hover:bg-slate-100 transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <div class="p-4 bg-slate-50/50">
        <input type="text" id="personnelSearch" oninput="filterPersonnel()" placeholder="搜尋號碼、姓名或階級..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-100 bg-white">
      </div>
      <div class="p-4 overflow-y-auto flex-1 divide-y divide-slate-100" id="personnelList">
        <!-- 名冊動態寫入 -->
      </div>
    </div>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw0Jh6kECVnbizPWeWg_IjthIjxMfE7jV06fQKxTOgjHnag_gr7wx5ZBaInuIMnCV1i/exec";

    const DUTY_KEYS = ["值班", "檢查", "守望", "巡邏", "備勤", "檢查二", "休假"];
    const DUTY_ICONS = {
      "值班": "fa-shield-halved",
      "檢查": "fa-list-check",
      "守望": "fa-binoculars",
      "巡邏": "fa-person-walking",
      "備勤": "fa-clock",
      "檢查二": "fa-file-signature",
      "休假": "fa-bed"
    };

    let currentShift = "第一班";
    let viewMode = "view"; 
    let currentPassword = "";
    let rawSheetData = [];
    let personnelList = [];
    let shiftData = { "第一班": {}, "第二班": {}, "第三班": {} };
    let leaveData = { numbersStr: "", rawNums: [], formattedList: [] }; 
    let backgroundTimer = null;

    window.addEventListener("load", () => {
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          backgroundTimer = setTimeout(() => { logout(); }, 60000);
        } else {
          if (backgroundTimer) { clearTimeout(backgroundTimer); backgroundTimer = null; }
        }
      });
      window.addEventListener("beforeunload", () => { logout(); });
    });

    async function handleLogin(e) {
      e.preventDefault();
      const pwd = document.getElementById("passwordInput").value.trim();
      if (!pwd) return;

      currentPassword = pwd;
      const btn = document.getElementById("loginBtn");
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> 載入中...`;

      const success = await fetchData();
      btn.disabled = false;
      btn.innerHTML = `<span>進入班表</span>`;

      if (success) {
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("appHeader").classList.remove("hidden");
        document.getElementById("appSection").classList.remove("hidden");
        selectShift("第一班");
      }
    }

    function logout() {
      currentPassword = "";
      rawSheetData = [];
      shiftData = { "第一班": {}, "第二班": {}, "第三班": {} };
      leaveData = { numbersStr: "", rawNums: [], formattedList: [] };
      document.getElementById("loginSection").classList.remove("hidden");
      document.getElementById("appHeader").classList.add("hidden");
      document.getElementById("appSection").classList.add("hidden");
      document.getElementById("passwordInput").value = "";
    }

    async function fetchData() {
      const refreshBtn = document.getElementById("refreshBtn");
      if (refreshBtn) refreshBtn.classList.add("animate-spin");

      try {
        const fullUrl = `${GAS_WEB_APP_URL}?password=${encodeURIComponent(currentPassword)}&_t=${Date.now()}`;
        const res = await fetch(fullUrl);
        const json = await res.json();

        if (json.status !== "success") {
          alert(json.message || "讀取失敗，密碼可能錯誤！");
          return false;
        }

        rawSheetData = json.rawData || [];
        personnelList = json.personnel || [];

        parseRawData(rawSheetData);
        renderAll();
        return true;
      } catch (err) {
        alert("連線失敗: " + err.toString());
        return false;
      } finally {
        if (refreshBtn) refreshBtn.classList.remove("animate-spin");
      }
    }

    // 自動動態定位試算表欄位！
    function parseRawData(data) {
      if (!data || data.length === 0) return;

      shiftData = { "第一班": {}, "第二班": {}, "第三班": {} };

      // 1. 動態掃描第 1 列 (標題列)，找出「數字欄」與「姓名結果欄」的真實 Index
      const headerRow = data[0] || [];
      
      const targetDuties = ["值班", "檢查", "守望", "巡邏", "備勤", "檢查二"];
      let dutyCols = {};   // 存放輸入號碼欄索引
      let resultCols = {}; // 存放對應姓名結果欄索引

      targetDuties.forEach(dName => {
        let matchedIndices = [];
        headerRow.forEach((hText, colIdx) => {
          if (String(hText).trim() === dName) {
            matchedIndices.push(colIdx);
          }
        });

        if (matchedIndices.length >= 2) {
          dutyCols[dName] = matchedIndices[0];   // 第一次出現的是號碼欄 (如 G 欄)
          resultCols[dName] = matchedIndices[1]; // 第二次出現的是姓名結果欄 (如 M 欄)
        } else if (matchedIndices.length === 1) {
          // 如果只有一欄，預設 offset 6 欄為結果欄
          dutyCols[dName] = matchedIndices[0];
          resultCols[dName] = matchedIndices[0] + 6;
        } else {
          // 安全預設 (G~L 為 6~11, M~R 為 12~17)
          const fallbackMap = { "值班": 6, "檢查": 7, "守望": 8, "巡邏": 9, "備勤": 10, "檢查二": 11 };
          dutyCols[dName] = fallbackMap[dName];
          resultCols[dName] = fallbackMap[dName] + 6;
        }
      });

      // 2. 班別起始列 (0-based)
      const shiftRowStartMap = {
        "第一班": 1, 
        "第二班": 7, 
        "第三班": 13 
      };

      // 3. 讀取並填入班別資料
      Object.keys(shiftRowStartMap).forEach(sName => {
        const startRowIndex = shiftRowStartMap[sName];

        targetDuties.forEach(key => {
          const numCol = dutyCols[key];
          const resCol = resultCols[key];

          let rawNums = [];
          let formattedList = [];

          for (let r = 0; r < 5; r++) {
            const rIdx = startRowIndex + r;
            if (rIdx < data.length && data[rIdx]) {
              const val = data[rIdx][numCol];
              const resVal = data[rIdx][resCol];

              if (val !== "" && val !== undefined && val !== null) {
                rawNums.push(String(val).trim());
              }
              if (resVal !== "" && resVal !== undefined && resVal !== null) {
                formattedList.push(String(resVal).trim());
              }
            }
          }

          shiftData[sName][key] = {
            numbersStr: rawNums.join(", "),
            rawNums: rawNums,
            formattedList: formattedList
          };
        });
      });

      // 4. 自動尋找休假欄位 (標題包含 "休假")
      let leaveCol = -1;
      let leaveResultCol = -1;
      headerRow.forEach((hText, colIdx) => {
        if (String(hText).trim().includes("休假")) {
          if (leaveCol === -1) leaveCol = colIdx;
          else if (leaveResultCol === -1) leaveResultCol = colIdx;
        }
      });

      if (leaveCol === -1) leaveCol = 20; // U 欄預設
      if (leaveResultCol === -1) leaveResultCol = leaveCol + 1; // V 欄預設

      let leaveRawNums = [];
      let leaveFormattedList = [];
      for (let r = 1; r < Math.min(25, data.length); r++) {
        if (data[r]) {
          const val = data[r][leaveCol];  
          const resVal = data[r][leaveResultCol]; 

          if (val !== "" && val !== undefined && val !== null) {
            leaveRawNums.push(String(val).trim());
          }
          if (resVal !== "" && resVal !== undefined && resVal !== null) {
            leaveFormattedList.push(String(resVal).trim());
          }
        }
      }

      leaveData = {
        numbersStr: leaveRawNums.join(", "),
        rawNums: leaveRawNums,
        formattedList: leaveFormattedList
      };
    }

    function selectShift(shiftName) {
      currentShift = shiftName;
      document.querySelectorAll(".shift-tab").forEach(tab => {
        tab.classList.remove("bg-blue-600", "text-white", "shadow-md");
        tab.classList.add("text-slate-600", "hover:bg-slate-200/60");
      });
      const activeTab = document.getElementById(`tab-${shiftName}`);
      if (activeTab) {
        activeTab.classList.remove("text-slate-600", "hover:bg-slate-200/60");
        activeTab.classList.add("bg-blue-600", "text-white", "shadow-md");
      }
      document.getElementById("currentShiftTitle").innerText = shiftName;
      renderAll();
    }

    function setViewMode(mode) {
      viewMode = mode;
      const vBtn = document.getElementById("mode-view");
      const eBtn = document.getElementById("mode-edit");
      const badge = document.getElementById("modeBadge");

      if (mode === "view") {
        vBtn.className = "px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-800 shadow-sm";
        eBtn.className = "px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-500 hover:text-slate-800";
        document.getElementById("viewContainer").classList.remove("hidden");
        document.getElementById("editContainer").classList.add("hidden");
        if (badge) badge.innerText = "勤務配置";
      } else {
        eBtn.className = "px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-800 shadow-sm";
        vBtn.className = "px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-500 hover:text-slate-800";
        document.getElementById("viewContainer").classList.add("hidden");
        document.getElementById("editContainer").classList.remove("hidden");
        if (badge) badge.innerText = "編輯號碼";
      }
      renderAll();
    }

    function renderAll() {
      if (viewMode === "view") {
        renderViewCards();
      } else {
        renderEditInputs();
      }
    }

    function renderViewCards() {
      const container = document.getElementById("viewContainer");
      container.innerHTML = "";
      const currentShiftObj = shiftData[currentShift] || {};

      DUTY_KEYS.forEach(key => {
        const item = (key === "休假") ? leaveData : (currentShiftObj[key] || { formattedList: [] });
        const icon = DUTY_ICONS[key] || "fa-shield";
        const count = item.formattedList ? item.formattedList.length : 0;

        let listHtml = "";
        if (item.formattedList && item.formattedList.length > 0) {
          listHtml = item.formattedList.map(text => {
            const parts = text.split("-");
            let num = parts[0] || "";
            let info = parts.slice(1).join(" ") || text;
            return `
              <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-100">
                <span class="w-7 h-7 rounded-lg bg-blue-100 text-blue-700 font-mono font-bold text-xs flex items-center justify-center mr-2 shadow-sm">${num}</span>
                <span class="text-xs font-bold text-slate-700 flex-1">${info}</span>
              </div>
            `;
          }).join("");
        } else {
          listHtml = `<div class="py-6 text-center text-xs text-slate-300 font-medium">未排定人員</div>`;
        }

        const card = document.createElement("div");
        card.className = "bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition space-y-3";
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
              <div class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center text-sm border border-blue-100">
                <i class="fa-solid ${icon}"></i>
              </div>
              <h3 class="font-bold text-slate-800 text-base">${key} ${key === '休假' ? '<span class="text-xs text-slate-400 font-normal">(全天)</span>' : ''}</h3>
            </div>
            <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ${count > 0 ? 'bg-blue-50 text-blue-600 border border-blue-100' : 'bg-slate-100 text-slate-400'}">${count} 人</span>
          </div>
          <div class="space-y-1.5 pt-1">
            ${listHtml}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderEditInputs() {
      const container = document.getElementById("editFields");
      container.innerHTML = "";
      const currentShiftObj = shiftData[currentShift] || {};

      DUTY_KEYS.forEach(key => {
        const item = (key === "休假") ? leaveData : (currentShiftObj[key] || { numbersStr: "" });
        const icon = DUTY_ICONS[key] || "fa-shield";

        const div = document.createElement("div");
        div.className = "bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-2";
        div.innerHTML = `
          <label class="block font-bold text-slate-800 text-sm flex items-center gap-2">
            <i class="fa-solid ${icon} text-slate-400 text-xs"></i>
            <span>${key} ${key === '休假' ? '(全天休假人員號碼)' : '(輸入人員號碼)'}</span>
          </label>
          <input type="text" id="input-${key}" value="${item.numbersStr || ''}" placeholder="例如: 34, 33, 32"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-100 bg-slate-50/50 font-mono font-bold text-slate-700">
        `;
        container.appendChild(div);
      });
    }

    async function handleSaveDuties(e) {
      e.preventDefault();

      const dutiesPayload = {};
      DUTY_KEYS.forEach(key => {
        const input = document.getElementById(`input-${key}`);
        dutiesPayload[key] = input ? input.value : "";
      });

      const saveBtn = document.getElementById("saveBtn");
      saveBtn.disabled = true;
      saveBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> 寫入中...`;

      try {
        const res = await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            password: currentPassword,
            shiftName: currentShift,
            duties: dutiesPayload
          })
        });

        const json = await res.json();
        if (json.status === "success") {
          alert(`資料已成功更新！`);
          await fetchData();
          setViewMode("view");
        } else {
          alert("寫入失敗：" + (json.message || "未知錯誤"));
        }
      } catch (err) {
        alert("寫入請求失敗：" + err.toString());
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> <span>儲存</span>`;
      }
    }

    function openPersonnelModal() {
      renderPersonnelList(personnelList);
      document.getElementById("personnelModal").classList.remove("hidden");
    }

    function closePersonnelModal() {
      document.getElementById("personnelModal").classList.add("hidden");
    }

    function renderPersonnelList(list) {
      const container = document.getElementById("personnelList");
      if (!list || list.length === 0) {
        container.innerHTML = `<div class="p-4 text-center text-xs text-slate-400">目前尚無名冊資料</div>`;
        return;
      }

      container.innerHTML = list.map(p => `
        <div class="py-2.5 flex items-center justify-between text-sm">
          <div class="flex items-center space-x-3">
            <span class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 border border-blue-100 font-mono font-bold flex items-center justify-center text-xs">${p.number}</span>
            <span class="font-bold text-slate-800">${p.name}</span>
          </div>
          <span class="px-2.5 py-1 rounded-md text-xs font-medium bg-slate-100 text-slate-600">${p.rank}</span>
        </div>
      `).join("");
    }

    function filterPersonnel() {
      const q = document.getElementById("personnelSearch").value.trim().toLowerCase();
      if (!q) return renderPersonnelList(personnelList);
      const filtered = personnelList.filter(p => 
        String(p.number).includes(q) || p.name.toLowerCase().includes(q) || p.rank.toLowerCase().includes(q)
      );
      renderPersonnelList(filtered);
    }
  </script>
</body>
</html>
