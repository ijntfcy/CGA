<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>安漁班表</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');
    body {
      font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
    }
    .glass-header {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    input:focus, button:focus { outline: none; }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between">

  <!-- 頂部導覽列 -->
  <header id="appHeader" class="hidden sticky top-0 z-30 bg-white/90 glass-header border-b border-slate-200 px-3 py-2.5 transition-all duration-200 shadow-xs">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-sm shadow-blue-500/20">
          <i class="fa-solid fa-shield-halved text-sm"></i>
        </div>
        <div>
          <h1 class="font-bold text-slate-900 text-sm leading-tight">安漁班表2026/10/18</h1>
          <p class="text-[10px] text-slate-400 font-medium">勤務配置</p>
        </div>
      </div>
      <div class="flex items-center space-x-1.5">
        <button onclick="openPersonnelModal()" class="px-2.5 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 text-xs font-medium transition flex items-center gap-1 shadow-xs bg-white">
          <i class="fa-solid fa-users text-blue-600"></i><span>名冊</span>
        </button>
        <button onclick="logout()" class="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-red-50 text-slate-600 hover:text-red-600 text-xs font-medium transition flex items-center gap-1 border border-slate-200">
          <span>登出</span><i class="fa-solid fa-right-from-bracket text-[10px]"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-4xl mx-auto w-full p-2 sm:p-4 flex-1 space-y-3">

    <!-- 登入頁面 -->
    <div id="loginSection" class="min-h-[85vh] flex items-center justify-center p-2">
      <div class="w-full max-w-sm bg-white rounded-3xl p-6 sm:p-8 border border-slate-200/80 shadow-xl shadow-slate-200/50 text-center space-y-5">
        <div class="w-14 h-14 bg-blue-50 rounded-2xl flex items-center justify-center mx-auto text-blue-600 border border-blue-100 shadow-xs">
          <i class="fa-solid fa-lock text-xl"></i>
        </div>
        <div>
          <h2 class="text-xl font-bold text-slate-900">安漁班表</h2>
          <p class="text-slate-400 text-xs mt-1">請輸入驗證密碼登入</p>
        </div>
        <form onsubmit="handleLogin(event)" class="space-y-3.5 text-left">
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1.5">驗證密碼</label>
            <input type="password" id="passwordInput" placeholder="請輸入密碼" required
              class="w-full px-3.5 py-3 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition text-center text-base tracking-widest font-semibold text-slate-700 bg-slate-50/50">
          </div>
          <button type="submit" id="loginBtn"
            class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold py-3 px-4 rounded-xl shadow-md shadow-blue-500/20 transition flex items-center justify-center gap-2 text-sm">
            <span>進入班表</span>
          </button>
        </form>
        <p class="text-[10px] text-slate-400 leading-relaxed">離開頁面會自動登出；切換 App 超過 1 分鐘將安全登出</p>
      </div>
    </div>

    <!-- 主要班表視圖區塊 -->
    <div id="appSection" class="hidden space-y-3">

      <!-- 工具列：班別快速切換 + 模式切換與刷新 -->
      <div class="bg-white p-2 rounded-2xl border border-slate-200/80 shadow-xs flex flex-col gap-2">
        <div class="flex items-center justify-between gap-2">
          <!-- 班別選擇 -->
          <div class="flex bg-slate-100 p-1 rounded-xl gap-1 flex-1">
            <button onclick="selectShift('全部')" id="tab-全部" class="shift-tab flex-1 py-1.5 px-2 rounded-lg text-xs font-bold transition text-center">三班全覽</button>
            <button onclick="selectShift('第一班')" id="tab-第一班" class="shift-tab flex-1 py-1.5 px-2 rounded-lg text-xs font-bold transition text-center">第一班</button>
            <button onclick="selectShift('第二班')" id="tab-第二班" class="shift-tab flex-1 py-1.5 px-2 rounded-lg text-xs font-bold transition text-center">第二班</button>
            <button onclick="selectShift('第三班')" id="tab-第三班" class="shift-tab flex-1 py-1.5 px-2 rounded-lg text-xs font-bold transition text-center">第三班</button>
          </div>
          <!-- 重新整理 -->
          <button onclick="fetchData()" id="refreshBtn" title="重新整理" class="p-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 active:bg-slate-100 transition shadow-xs bg-white">
            <i class="fa-solid fa-arrows-rotate text-xs"></i>
          </button>
        </div>

        <div class="flex items-center justify-between pt-1 border-t border-slate-100 px-1">
          <span id="currentShiftTitle" class="font-bold text-slate-800 text-sm">三班全覽</span>
          <!-- 模式切換 -->
          <div class="bg-slate-100 p-0.5 rounded-lg flex">
            <button onclick="setViewMode('view')" id="mode-view" class="px-3 py-1 rounded-md text-xs font-semibold flex items-center gap-1 transition">
              <i class="fa-regular fa-eye"></i> 班表
            </button>
            <button onclick="setViewMode('edit')" id="mode-edit" class="px-3 py-1 rounded-md text-xs font-semibold flex items-center gap-1 transition">
              <i class="fa-solid fa-pen"></i> 編輯
            </button>
          </div>
        </div>
      </div>

      <!-- 統計數據看板 (直接定點取出 Y 欄 [Col 24] 與 Z 欄 [Col 25]) -->
      <div class="grid grid-cols-4 gap-1.5 text-center">
        <div class="bg-amber-50 border border-amber-200/80 p-2 rounded-xl shadow-xs">
          <div class="text-[10px] text-amber-700 font-medium">上班</div>
          <div id="stat-work" class="text-sm font-bold text-amber-800 mt-0.5">-</div>
        </div>
        <div class="bg-emerald-50 border border-emerald-200/80 p-2 rounded-xl shadow-xs">
          <div class="text-[10px] text-emerald-700 font-medium">休假</div>
          <div id="stat-leave" class="text-sm font-bold text-emerald-800 mt-0.5">-</div>
        </div>
        <div class="bg-blue-50 border border-blue-200/80 p-2 rounded-xl shadow-xs">
          <div class="text-[10px] text-blue-700 font-medium">支援/其他</div>
          <div id="stat-support" class="text-sm font-bold text-blue-800 mt-0.5">-</div>
        </div>
        <div class="bg-slate-100 border border-slate-200 p-2 rounded-xl shadow-xs">
          <div class="text-[10px] text-slate-600 font-medium">總人數</div>
          <div id="stat-total" class="text-sm font-bold text-slate-800 mt-0.5">-</div>
        </div>
      </div>

      <!-- 班表卡片檢視 (View Mode) -->
      <div id="viewContainer" class="space-y-3">
        <!-- 由 JS 動態繪製 -->
      </div>

      <!-- 編輯模式容器 (Edit Mode) -->
      <div id="editContainer" class="hidden space-y-3">
        <div class="bg-amber-50 border border-amber-200 p-3 rounded-2xl shadow-xs space-y-3">
          <div class="flex items-center justify-between text-xs text-amber-900 font-medium">
            <span>編輯班別：<strong id="editShiftNameLabel" class="underline">第一班</strong></span>
            <span class="text-amber-700">（修改需驗證密碼）</span>
          </div>
          <div class="space-y-1">
            <label class="block text-[11px] font-bold text-amber-800">請輸入密碼</label>
            <input type="password" id="editAuthPassword" placeholder="請輸入密碼" 
              class="w-full px-3 py-2 rounded-xl border border-amber-300 text-xs focus:border-amber-500 focus:ring-2 focus:ring-amber-200 bg-white font-mono font-bold text-slate-800">
          </div>
        </div>

        <form onsubmit="handleSaveDuties(event)" class="space-y-3">
          <div id="editFields" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            <!-- 由 JS 動態產生輸入框 -->
          </div>
          <div class="pt-1">
            <button type="submit" id="saveBtn" class="w-full py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold rounded-xl shadow-md shadow-blue-500/20 transition flex items-center justify-center gap-2 text-sm">
              <i class="fa-solid fa-floppy-disk"></i>
              <span>確認儲存變更</span>
            </button>
          </div>
        </form>
      </div>

    </div>
  </main>

  <!-- 人員名冊 Modal -->
  <div id="personnelModal" class="hidden fixed inset-0 z-50 bg-slate-900/40 glass-header flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl border border-slate-200 shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
      <div class="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between bg-slate-50">
        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
          <i class="fa-solid fa-address-book text-blue-600"></i> 人員名冊
        </h3>
        <button onclick="closePersonnelModal()" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg hover:bg-slate-200/50 transition">
          <i class="fa-solid fa-xmark text-base"></i>
        </button>
      </div>
      <div class="p-3 bg-white border-b border-slate-100">
        <input type="text" id="personnelSearch" oninput="filterPersonnel()" placeholder="搜尋號碼、姓名或階級..." class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-xs focus:border-blue-500 focus:ring-2 focus:ring-blue-100 bg-slate-50/50">
      </div>
      <div class="p-3 overflow-y-auto flex-1 divide-y divide-slate-100" id="personnelList">
        <!-- 名冊動態寫入 -->
      </div>
    </div>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw0Jh6kECVnbizPWeWg_IjthIjxMfE7jV06fQKxTOgjHnag_gr7wx5ZBaInuIMnCV1i/exec";

    const DUTY_KEYS = ["值班", "檢查", "守望", "巡邏", "備勤", "檢查二", "支援"];
    const DUTY_ICONS = {
      "值班": "fa-shield-halved",
      "檢查": "fa-list-check",
      "守望": "fa-binoculars",
      "巡邏": "fa-person-walking",
      "備勤": "fa-clock",
      "檢查二": "fa-file-signature",
      "支援": "fa-handshake-angle"
    };

    let currentShift = "全部"; 
    let viewMode = "view"; 
    let currentPassword = "";
    let rawSheetData = [];
    let personnelList = [];
    let shiftData = { "第一班": {}, "第二班": {}, "第三班": {} };
    let statsData = { work: 0, leave: 0, support: 0, total: 0 };
    let backgroundTimer = null;

    window.addEventListener("load", () => {
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          backgroundTimer = setTimeout(() => { logout(); }, 60000);
        } else {
          if (backgroundTimer) { clearTimeout(backgroundTimer); backgroundTimer = null; }
        }
      });
      window.addEventListener("beforeunload", () => { logout(); });
    });

    async function handleLogin(e) {
      e.preventDefault();
      const pwd = document.getElementById("passwordInput").value.trim();
      if (!pwd) return;

      currentPassword = pwd;
      const btn = document.getElementById("loginBtn");
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> 載入中...`;

      const success = await fetchData();
      btn.disabled = false;
      btn.innerHTML = `<span>進入班表</span>`;

      if (success) {
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("appHeader").classList.remove("hidden");
        document.getElementById("appSection").classList.remove("hidden");
        selectShift("全部");
      }
    }

    function logout() {
      currentPassword = "";
      rawSheetData = [];
      shiftData = { "第一班": {}, "第二班": {}, "第三班": {} };
      document.getElementById("loginSection").classList.remove("hidden");
      document.getElementById("appHeader").classList.add("hidden");
      document.getElementById("appSection").classList.add("hidden");
      document.getElementById("passwordInput").value = "";
    }

    async function fetchData() {
      const refreshBtn = document.getElementById("refreshBtn");
      if (refreshBtn) refreshBtn.classList.add("animate-spin");

      try {
        const fullUrl = `${GAS_WEB_APP_URL}?password=${encodeURIComponent(currentPassword)}&_t=${Date.now()}`;
        const res = await fetch(fullUrl);
        const json = await res.json();

        if (json.status !== "success") {
          alert(json.message || "讀取失敗，密碼可能錯誤！");
          return false;
        }

        rawSheetData = json.rawData || [];
        personnelList = json.personnel || [];

        parseFastData(rawSheetData);
        renderAll();
        return true;
      } catch (err) {
        alert("連線失敗: " + err.toString());
        return false;
      } finally {
        if (refreshBtn) refreshBtn.classList.remove("animate-spin");
      }
    }

    // 極速直接索引定點抓取 (Direct Index Lookup)
    function parseFastData(data) {
      if (!data || data.length === 0) return;

      // 1. 定點取出 Y 欄 (Col 24) 與 Z 欄 (Col 25) 統計數據
      // 列 1: 上班(19), 列 2: 休假(15), 列 3: 支援(3), 列 4: 總人數(37)
      statsData = {
        work: (data[0] && data[0][24] !== undefined) ? Number(data[0][24]) : 0,
        leave: (data[1] && data[1][24] !== undefined) ? Number(data[1][24]) : 0,
        support: (data[2] && data[2][24] !== undefined) ? Number(data[2][24]) : 0,
        total: (data[3] && data[3][24] !== undefined) ? Number(data[3][24]) : 0
      };

      // 2. 解析三班勤務（I~O欄號碼，Q~W欄呈現字串）
      shiftData = { "第一班": {}, "第二班": {}, "第三班": {} };
      const duties = ["值班", "檢查", "守望", "巡邏", "備勤", "檢查二", "支援"];
      const colMap = {
        "值班": { num: 8, res: 16 },
        "檢查": { num: 9, res: 17 },
        "守望": { num: 10, res: 18 },
        "巡邏": { num: 11, res: 19 },
        "備勤": { num: 12, res: 20 },
        "檢查二": { num: 13, res: 21 },
        "支援": { num: 14, res: 22 }
      };

      const shiftStartRows = {
        "第一班": 1, // 第 2 列索引為 1 (1~4)
        "第二班": 9, // 第 10 列索引為 9 (9~12)
        "第三班": 17 // 第 18 列索引為 17 (17~20)
      };

      Object.keys(shiftStartRows).forEach(sName => {
        const startRow = shiftStartRows[sName];

        duties.forEach(duty => {
          const { num: numCol, res: resCol } = colMap[duty];
          let rawNums = [];
          let formattedList = [];

          for (let r = 0; r < 4; r++) {
            const rIdx = startRow + r;
            if (rIdx < data.length && data[rIdx]) {
              const val = data[rIdx][numCol];
              const resVal = data[rIdx][resCol];

              if (val !== "" && val !== undefined && val !== null) {
                rawNums.push(String(val).trim());
              }
              if (resVal !== "" && resVal !== undefined && resVal !== null) {
                formattedList.push(String(resVal).trim());
              }
            }
          }

          shiftData[sName][duty] = {
            numbersStr: rawNums.join(", "),
            formattedList: formattedList
          };
        });
      });
    }

    function selectShift(shiftName) {
      currentShift = shiftName;
      document.querySelectorAll(".shift-tab").forEach(tab => {
        tab.classList.remove("bg-blue-600", "text-white", "shadow-sm");
        tab.classList.add("text-slate-600", "hover:bg-slate-200/60");
      });
      const activeTab = document.getElementById(`tab-${shiftName}`);
      if (activeTab) {
        activeTab.classList.remove("text-slate-600", "hover:bg-slate-200/60");
        activeTab.classList.add("bg-blue-600", "text-white", "shadow-md");
      }
      
      const titleEl = document.getElementById("currentShiftTitle");
      if (titleEl) {
        titleEl.innerText = shiftName === '全部' ? '三班全覽' : shiftName;
      }

      if (viewMode === 'edit' && shiftName === '全部') {
        currentShift = '第一班';
        selectShift('第一班');
        return;
      }
      const editLabel = document.getElementById("editShiftNameLabel");
      if (editLabel) editLabel.innerText = currentShift;

      renderAll();
    }

    function setViewMode(mode) {
      viewMode = mode;
      const vBtn = document.getElementById("mode-view");
      const eBtn = document.getElementById("mode-edit");

      if (mode === "view") {
        vBtn.className = "px-3 py-1 rounded-md text-xs font-semibold bg-white text-slate-800 shadow-xs";
        eBtn.className = "px-3 py-1 rounded-md text-xs font-semibold text-slate-500 hover:text-slate-800";
        document.getElementById("viewContainer").classList.remove("hidden");
        document.getElementById("editContainer").classList.add("hidden");
      } else {
        eBtn.className = "px-3 py-1 rounded-md text-xs font-semibold bg-white text-slate-800 shadow-xs";
        vBtn.className = "px-3 py-1 rounded-md text-xs font-semibold text-slate-500 hover:text-slate-800";
        document.getElementById("viewContainer").classList.add("hidden");
        document.getElementById("editContainer").classList.remove("hidden");
        if (currentShift === "全部") {
          currentShift = "第一班";
          selectShift("第一班");
          return;
        }
      }
      renderAll();
    }

    function renderAll() {
      document.getElementById("stat-work").innerText = statsData.work;
      document.getElementById("stat-leave").innerText = statsData.leave;
      document.getElementById("stat-support").innerText = statsData.support;
      document.getElementById("stat-total").innerText = statsData.total;

      if (viewMode === "view") {
        renderViewCards();
      } else {
        renderEditInputs();
      }
    }

    function renderViewCards() {
      const container = document.getElementById("viewContainer");
      container.innerHTML = "";

      const shiftsToRender = currentShift === "全部" ? ["第一班", "第二班", "第三班"] : [currentShift];

      shiftsToRender.forEach(sName => {
        const shiftObj = shiftData[sName] || {};
        
        const shiftWrapper = document.createElement("div");
        shiftWrapper.className = "bg-white p-2.5 sm:p-3.5 rounded-2xl border border-slate-200/80 shadow-xs space-y-2";
        
        if (currentShift === "全部") {
          const shiftHeader = document.createElement("div");
          shiftHeader.className = "flex items-center justify-between border-b border-slate-100 pb-1.5";
          shiftHeader.innerHTML = `
            <span class="font-bold text-slate-900 text-xs flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-blue-600"></span>
              ${sName}
            </span>
            <button onclick="selectShift('${sName}'); setViewMode('edit');" class="text-[11px] text-blue-600 hover:underline font-semibold">編輯此班</button>
          `;
          shiftWrapper.appendChild(shiftHeader);
        }

        const gridDiv = document.createElement("div");
        gridDiv.className = "grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-1.5";

        let activeDutyCount = 0;

        DUTY_KEYS.forEach(key => {
          const item = shiftObj[key] || { formattedList: [] };
          const count = item.formattedList ? item.formattedList.length : 0;

          if (count === 0) return;

          activeDutyCount++;
          const icon = DUTY_ICONS[key] || "fa-shield";

          let listHtml = item.formattedList.map(text => {
            const parts = text.split("-");
            let num = parts[0] || "";
            let info = parts.slice(1).join(" ") || text;
            return `
              <div class="flex items-center justify-between p-1 rounded bg-slate-50 border border-slate-100 text-[11px]">
                <span class="w-4 h-4 rounded bg-blue-100 text-blue-700 font-mono font-bold flex items-center justify-center mr-1 text-[10px]">${num}</span>
                <span class="font-bold text-slate-700 truncate">${info}</span>
              </div>
            `;
          }).join("");

          const card = document.createElement("div");
          card.className = "bg-slate-50/70 p-2 rounded-xl border border-slate-200/60 space-y-1 flex flex-col justify-between";
          card.innerHTML = `
            <div>
              <div class="flex items-center justify-between mb-1">
                <span class="text-[11px] font-bold text-slate-800 flex items-center gap-1">
                  <i class="fa-solid ${icon} text-blue-600 text-[9px]"></i> ${key}
                </span>
                <span class="text-[9px] px-1 py-0.2 rounded bg-blue-50 text-blue-600 font-semibold">${count}人</span>
              </div>
              <div class="space-y-0.5">
                ${listHtml}
              </div>
            </div>
          `;
          gridDiv.appendChild(card);
        });

        if (activeDutyCount === 0) {
          const emptyNotice = document.createElement("div");
          emptyNotice.className = "py-4 text-center text-xs text-slate-400 font-medium";
          emptyNotice.innerText = "此班目前尚未排定任何勤務";
          shiftWrapper.appendChild(emptyNotice);
        } else {
          shiftWrapper.appendChild(gridDiv);
        }

        container.appendChild(shiftWrapper);
      });
    }

    function renderEditInputs() {
      const container = document.getElementById("editFields");
      container.innerHTML = "";
      const currentShiftObj = shiftData[currentShift] || {};

      DUTY_KEYS.forEach(key => {
        const item = currentShiftObj[key] || { numbersStr: "" };
        const icon = DUTY_ICONS[key] || "fa-shield";

        const div = document.createElement("div");
        div.className = "bg-white p-3 rounded-2xl border border-slate-200/80 shadow-xs space-y-1.5";
        div.innerHTML = `
          <label class="block font-bold text-slate-800 text-xs flex items-center gap-1.5">
            <i class="fa-solid ${icon} text-slate-400 text-xs"></i>
            <span>${key} (輸入號碼)</span>
          </label>
          <input type="text" id="input-${key}" value="${item.numbersStr || ''}" placeholder="如: 9, 1, 31"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs focus:border-blue-500 focus:ring-2 focus:ring-blue-100 bg-slate-50/50 font-mono font-bold text-slate-700">
        `;
        container.appendChild(div);
      });
    }

    async function handleSaveDuties(e) {
      e.preventDefault();

      const authPwd = document.getElementById("editAuthPassword").value.trim();
      if (!authPwd) {
        alert("請輸入密碼！");
        return;
      }

      const dutiesPayload = {};
      DUTY_KEYS.forEach(key => {
        const input = document.getElementById(`input-${key}`);
        dutiesPayload[key] = input ? input.value : "";
      });

      const saveBtn = document.getElementById("saveBtn");
      saveBtn.disabled = true;
      saveBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> 寫入中...`;

      try {
        const res = await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            password: authPwd, 
            shiftName: currentShift,
            duties: dutiesPayload
          })
        });

        const json = await res.json();
        if (json.status === "success") {
          alert(`資料已成功更新！`);
          document.getElementById("editAuthPassword").value = ""; 
          await fetchData();
          setViewMode("view");
        } else {
          alert("寫入失敗：" + (json.message || "密碼錯誤或權限不足"));
        }
      } catch (err) {
        alert("寫入請求失敗：" + err.toString());
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> <span>確認儲存變更</span>`;
      }
    }

    function openPersonnelModal() {
      renderPersonnelList(personnelList);
      document.getElementById("personnelModal").classList.remove("hidden");
    }

    function closePersonnelModal() {
      document.getElementById("personnelModal").classList.add("hidden");
    }

    function renderPersonnelList(list) {
      const container = document.getElementById("personnelList");
      if (!list || list.length === 0) {
        container.innerHTML = `<div class="p-4 text-center text-xs text-slate-400">目前尚無名冊資料</div>`;
        return;
      }

      container.innerHTML = list.map(p => `
        <div class="py-2.5 flex items-center justify-between text-xs sm:text-sm">
          <div class="flex items-center space-x-2.5">
            <span class="w-7 h-7 rounded-lg bg-blue-50 text-blue-600 border border-blue-100 font-mono font-bold flex items-center justify-center text-xs">${p.number}</span>
            <span class="font-bold text-slate-800">${p.name}</span>
          </div>
          <span class="px-2 py-0.5 rounded-md text-[11px] font-medium bg-slate-100 text-slate-600">${p.rank}</span>
        </div>
      `).join("");
    }

    function filterPersonnel() {
      const q = document.getElementById("personnelSearch").value.trim().toLowerCase();
      if (!q) return renderPersonnelList(personnelList);
      const filtered = personnelList.filter(p => 
        String(p.number).includes(q) || p.name.toLowerCase().includes(q) || p.rank.toLowerCase().includes(q)
      );
      renderPersonnelList(filtered);
    }
  </script>
</body>
</html>
