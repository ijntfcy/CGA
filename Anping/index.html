<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CGA</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0b0f17;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .modal-backdrop {
      background-color: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
    }
    .spinner {
      border: 3px solid rgba(0, 0, 0, 0.1);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border-left-color: #000000;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4">

  <!-- ==================== 1. 登入頁面 (Login View) ==================== -->
  <div id="loginView" class="w-full max-w-md flex flex-col items-center text-center space-y-6">
    <div class="w-28 h-28 md:w-32 md:h-32 rounded-lg overflow-hidden border-2 border-slate-700 shadow-xl bg-slate-800 flex items-center justify-center">
      <img src="./img/Anping.jpg" alt="Anping Logo" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://via.placeholder.com/128?text=Anping+Img';">
    </div>

    <div class="space-y-1">
      <h1 class="text-3xl font-extrabold tracking-wider">安漁</h1>
      <p class="text-xs text-slate-400 tracking-widest font-mono uppercase">COAST GUARD ADMINISTRATION 2026/09/22更新</p>
    </div>

    <div class="w-full bg-[#120a06]/90 border border-orange-900/60 rounded-3xl p-5 flex flex-col items-center justify-center text-center space-y-2 shadow-2xl">
      <div class="flex items-center justify-center space-x-2">
        <span class="text-amber-400 text-2xl">⚠️</span>
        <span class="text-orange-500 font-medium text-sm sm:text-base tracking-wide">此為休假人員開發，非官方正式網頁。</span>
      </div>
      <p class="text-orange-500 font-medium text-sm sm:text-base tracking-wide">
        內容以法規法令為主，僅供內部人員參閱。
      </p>
    </div>

    <div class="w-full bg-slate-800/80 border border-slate-700/60 rounded-3xl p-6 shadow-2xl space-y-4">
      <input 
        type="password" 
        inputmode="numeric"
        pattern="[0-9]*"
        id="pwdInput" 
        placeholder="請輸入通行密碼" 
        class="w-full bg-black/60 border border-slate-700 text-white placeholder-slate-500 rounded-2xl px-4 py-4 text-center text-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/50 transition-all"
        onfocus="warmupGAS()"
        onkeydown="if(event.key==='Enter') verifyPassword()"
      >
      <button 
        id="loginBtn"
        onclick="verifyPassword()" 
        class="w-full bg-white hover:bg-slate-200 text-black font-bold py-4 rounded-2xl text-lg shadow-lg hover:shadow-white/10 active:scale-[0.99] transition-all flex items-center justify-center space-x-2 disabled:opacity-50"
      >
        <span id="loginSpinner" class="spinner hidden"></span>
        <span id="loginBtnText">進入</span>
      </button>
    </div>
  </div>

  <!-- ==================== 2. 主頁面 (Main View) ==================== -->
  <div id="mainView" class="hidden w-full max-w-5xl space-y-6 my-auto py-6">
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center space-x-4">
        <img src="./img/Anping.jpg" class="w-12 h-12 rounded-lg object-cover border border-slate-700" alt="Icon">
        <div>
          <h2 class="text-2xl font-bold flex items-center gap-2">🔗 常用資源</h2>
          <p class="text-xs text-slate-400">常用工具捷徑導航</p>
        </div>
      </div>
      <button onclick="logout('手動登出')" class="text-xs text-slate-400 hover:text-red-400 bg-slate-800 hover:bg-slate-700/80 border border-slate-700 px-3 py-2 rounded-lg transition-all">
        🔒 手動登出
      </button>
    </div>

    <div id="linkGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </div>

  <!-- 通用提示對話框 (Alert Modal) -->
  <div id="alertModal" class="hidden fixed inset-0 z-[60] modal-backdrop flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-sm w-full shadow-2xl space-y-4 text-center">
      <p id="alertMessage" class="text-slate-200 text-base leading-relaxed"></p>
      <button onclick="closeModal('alertModal')" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl transition-all">
        確定
      </button>
    </div>
  </div>

  <!-- 問題回報視窗 (Report Modal) -->
  <div id="reportModal" class="hidden fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="text-xl font-bold text-white flex items-center gap-2">🚩 問題回報</h3>
        <button onclick="closeModal('reportModal')" class="text-slate-400 hover:text-white text-2xl font-bold">&times;</button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">回報人（預設匿名）</label>
          <input type="text" id="reportName" placeholder="可匿名不填" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">問題分類</label>
          <select id="reportCategory" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
            <option value="建議事項">功能建議</option>
            <option value="其他">其他</option>
            <option value="系統異常">網頁功能異常</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">問題說明</label>
          <textarea id="reportContent" rows="4" placeholder="請詳細描述遇到的問題..." class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-500"></textarea>
        </div>
      </div>

      <div class="flex space-x-3 pt-2">
        <button onclick="closeModal('reportModal')" class="w-1/3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-sm transition-all">
          取消
        </button>
        <button onclick="submitReport()" class="w-2/3 bg-amber-600 hover:bg-amber-500 text-white font-bold py-2.5 rounded-xl text-sm transition-all shadow-lg shadow-amber-900/30">
          送出回報
        </button>
      </div>
    </div>
  </div>

  <script>
    const NAV_LINKS = [
      { name: "行動化勤務系統", icon: "✅", url: "https://mdrs.cga.gov.tw/", color: "emerald" },
      { name: "巡邏20260921", icon: "⚖️", url: "https://ijntfcy.github.io/CGA/Anping/patrol.html", color: "slate" },
      { name: "119dts", icon: "✍️", url: "https://119dts.tncfd.gov.tw/DTS/caselist/html", color: "indigo" },
      { name: "備用連結", icon: "📑", url: "https://www.google.com/", color: "rose" },
      { name: "備用連結", icon: "🌊", url: "https://www.google.com/", color: "blue" },
      { name: "備用連結", icon: "📅", url: "https://www.google.com/", color: "cyan" },
      { name: "備用連結", icon: "📝", url: "https://www.google.com/", color: "teal" },
      { name: "備用連結", icon: "🎰", url: "https://www.google.com/", color: "violet" },
      { name: "備用連結", icon: "🏃", url: "https://www.google.com/", color: "red" },
      { name: "備用連結", icon: "📞", url: "https://www.google.com/", color: "stone" },
      { name: "備用連結", icon: "💡", url: "https://www.google.com/", color: "gray" },
      { name: "全國法規資料庫", icon: "⏰", url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0090009", color: "purple" },
      { name: "海洋委員會海巡署全球資訊網", icon: "📋", url: "https://www.cga.gov.tw/GipOpen/wSite/mp?mp=999", color: "orange" },
      { name: "問題回報", icon: "🚩", type: "modal", modalId: "reportModal", color: "amber" }
    ];

    const COLOR_MAP = {
      emerald: "bg-emerald-600 hover:bg-emerald-500 text-white",
      indigo:  "bg-indigo-600 hover:bg-indigo-500 text-white",
      purple:  "bg-purple-600 hover:bg-purple-500 text-white",
      orange:  "bg-orange-600 hover:bg-orange-500 text-white",
      amber:   "bg-amber-600 hover:bg-amber-500 text-white",
      slate:   "bg-slate-700 hover:bg-slate-600 text-white",
      rose:    "bg-rose-600 hover:bg-rose-500 text-white",
      blue:    "bg-blue-600 hover:bg-blue-500 text-white",
      cyan:    "bg-cyan-700 hover:bg-cyan-600 text-white",
      teal:    "bg-teal-600 hover:bg-teal-500 text-white",
      violet:  "bg-violet-600 hover:bg-violet-500 text-white",
      red:     "bg-red-700 hover:bg-red-600 text-white",
      stone:   "bg-stone-700 hover:bg-stone-600 text-white",
      gray:    "bg-gray-800 hover:bg-gray-700 text-slate-300 border border-slate-700"
    };

    function renderNavLinks() {
      const container = document.getElementById('linkGrid');
      container.innerHTML = NAV_LINKS.map(item => {
        const colorClass = COLOR_MAP[item.color] || COLOR_MAP.blue;
        const baseClass = `flex items-center justify-center space-x-2 font-bold h-20 rounded-2xl shadow-lg active:scale-[0.98] transition-all text-lg ${colorClass}`;

        if (item.type === 'modal') {
          return `<button onclick="openModal('${item.modalId}')" class="${baseClass}">
                    <span>${item.icon}</span><span>${item.name}</span>
                  </button>`;
        } else {
          return `<a href="${item.url || '#'}" target="_blank" class="${baseClass}">
                    <span>${item.icon}</span><span>${item.name}</span>
                  </a>`;
        }
      }).join('');
    }

    const GAS_URL = "https://script.google.com/macros/s/AKfycbzVuQ_bR5ao49r_KxlcvkRu_6liHd_-6sVjl3O1SnlOawvsQ3E80NwQit4ZE0WADzWl/exec";
    let userIP = "取得中...";
    let isWarmedUp = false;

    fetch('https://api.ipify.org?format=json')
      .then(res => res.json())
      .then(data => { userIP = data.ip; })
      .catch(() => { userIP = "無法讀取IP"; });

    function warmupGAS() {
      if (isWarmedUp) return;
      isWarmedUp = true;
      fetch(`${GAS_URL}?action=ping`, { mode: 'no-cors' }).catch(() => {});
    }

    function getDeviceInfo() {
      const ua = navigator.userAgent;
      let deviceType = "電腦 (PC)";
      let deviceOS = "未知作業系統";
      let browser = "標準瀏覽器";

      if (/iPhone/i.test(ua)) {
        deviceType = "iPhone";
        const match = ua.match(/OS (\d+_\d+)/);
        deviceOS = match ? `iOS ${match[1].replace('_', '.')}` : "iOS";
      } else if (/iPad/i.test(ua)) {
        deviceType = "iPad";
        deviceOS = "iPadOS";
      } else if (/Android/i.test(ua)) {
        deviceType = /Mobile/i.test(ua) ? "Android 手機" : "Android 平板";
        const match = ua.match(/Android\s([0-9\.]+)/);
        deviceOS = match ? `Android ${match[1]}` : "Android";
      } else if (/Macintosh/i.test(ua)) {
        deviceType = "Mac";
        deviceOS = "macOS";
      } else if (/Windows/i.test(ua)) {
        deviceType = "PC";
        deviceOS = "Windows";
      }

      if (/Line/i.test(ua)) {
        browser = "LINE 內建瀏覽器";
      } else if (/FBAN|FBAV/i.test(ua)) {
        browser = "Facebook App 內建瀏覽器";
      } else if (/Chrome/i.test(ua) && !/Edg/i.test(ua)) {
        browser = "Chrome";
      } else if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) {
        browser = "Safari";
      } else if (/Edg/i.test(ua)) {
        browser = "Edge";
      }

      return { deviceType, deviceOS, browser };
    }

    function showAlert(msg) {
      document.getElementById('alertMessage').innerText = msg;
      openModal('alertModal');
    }

    function openModal(id) {
      document.getElementById(id).classList.remove('hidden');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    function checkExistingSession() {
      const isLoggedIn = sessionStorage.getItem('isLoggedIn');
      if (isLoggedIn === 'true') {
        showMainView();
      }
    }

    function showMainView() {
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('mainView').classList.remove('hidden');
    }

    function verifyPassword() {
      const pwdInput = document.getElementById('pwdInput');
      const pwd = pwdInput.value.trim();
      if (!pwd) {
        showAlert("請輸入密碼！");
        return;
      }

      const info = getDeviceInfo();
      const loginBtn = document.getElementById('loginBtn');
      const loginBtnText = document.getElementById('loginBtnText');
      const loginSpinner = document.getElementById('loginSpinner');

      loginBtn.disabled = true;
      pwdInput.disabled = true;
      loginSpinner.classList.remove('hidden');
      loginBtnText.innerText = "驗證中...";

      const queryParams = new URLSearchParams({
        action: 'verifyPassword',
        password: pwd,
        ip: userIP,
        deviceType: info.deviceType,
        deviceOS: info.deviceOS,
        browser: info.browser
      });

      fetch(`${GAS_URL}?${queryParams.toString()}`)
        .then(res => res.json())
        .then(data => {
          loginBtn.disabled = false;
          pwdInput.disabled = false;
          loginSpinner.classList.add('hidden');
          loginBtnText.innerText = "進入";

          if (data.status === 'success') {
            showMainView();
            pwdInput.value = '';
            sessionStorage.setItem('isLoggedIn', 'true');
          } else {
            showAlert(data.message || "密碼錯誤，請重新輸入！");
          }
        })
        .catch(err => {
          loginBtn.disabled = false;
          pwdInput.disabled = false;
          loginSpinner.classList.add('hidden');
          loginBtnText.innerText = "進入";
          showAlert("連線失敗，請檢查網路狀態！");
        });
    }

    function logout(reason = '離開網頁') {
      const isLoggedIn = sessionStorage.getItem('isLoggedIn');
      if (isLoggedIn !== 'true') return;

      sessionStorage.removeItem('isLoggedIn');

      const logoutUrl = `${GAS_URL}?action=logLogout&ip=${encodeURIComponent(userIP)}&reason=${encodeURIComponent(reason)}`;

      if (navigator.sendBeacon) {
        navigator.sendBeacon(logoutUrl);
      } else {
        fetch(logoutUrl, { keepalive: true }).catch(() => {});
      }

      document.getElementById('mainView').classList.add('hidden');
      document.getElementById('loginView').classList.remove('hidden');
    }

    window.addEventListener('pagehide', () => {
      logout('離開網頁/關閉分頁');
    });

    function submitReport() {
      let name = document.getElementById('reportName').value.trim();
      if (!name) {
        name = "匿名";
      }
      
      const category = document.getElementById('reportCategory').value;
      const content = document.getElementById('reportContent').value.trim();

      if (!content) {
        showAlert("請填寫問題內容！");
        return;
      }

      const payload = {
        action: 'reportIssue',
        reporter: name,
        category: category,
        content: content
      };

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          showAlert("回報成功");
          document.getElementById('reportName').value = '';
          document.getElementById('reportContent').value = '';
          closeModal('reportModal');
        } else {
          showAlert("回報失敗：" + data.message);
        }
      })
      .catch(err => {
        showAlert("發送失敗，請稍後再試！");
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderNavLinks();
      checkExistingSession();
    });
  </script>
</body>
</html>
