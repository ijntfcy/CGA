<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>值星攻略</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #050608;
            --panel-bg: rgba(10, 12, 18, 0.9);
            --primary: #00ffcc;
            --primary-glow: rgba(0, 255, 204, 0.4);
            --error: #ff3366;
            --error-glow: rgba(255, 51, 102, 0.4);
            --text: #f1f5f9;
            --text-dim: #64748b;
            --border: #334155;
            --cyber-font: 'Share Tech Mono', 'Noto Sans TC', sans-serif;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: var(--cyber-font);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                linear-gradient(rgba(0, 255, 204, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 204, 0.04) 1px, transparent 1px);
            background-size: 25px 25px;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(0, 255, 204, 0.08) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }
        .top-bar {
            position: absolute;
            top: env(safe-area-inset-top, 20px);
            right: 20px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }
        .icon-btn {
            background: var(--panel-bg);
            border: 1px solid var(--primary);
            color: var(--primary);
            width: 42px;
            height: 42px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 10px var(--primary-glow);
            transition: all 0.2s ease;
        }
        .icon-btn:active {
            transform: scale(0.9);
            box-shadow: 0 0 20px var(--primary);
        }
        .main-container {
            width: 90%;
            max-width: 380px;
            background: var(--panel-bg);
            border: 2px solid var(--primary);
            border-radius: 16px;
            padding: 35px 25px;
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.2);
            backdrop-filter: blur(12px);
            z-index: 5;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .main-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            animation: scan 2.5s linear infinite;
        }
        @keyframes scan {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .system-logo {
            font-size: 56px;
            color: var(--primary);
            margin-bottom: 20px;
            text-shadow: 0 0 20px var(--primary);
            animation: pulse 2s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(1); text-shadow: 0 0 10px var(--primary-glow); }
            100% { transform: scale(1.05); text-shadow: 0 0 30px var(--primary); }
        }
        h1 {
            font-size: 24px;
            letter-spacing: 3px;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .subtitle {
            color: var(--text-dim);
            font-size: 12px;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .cyber-btn {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 16px;
            font-size: 16px;
            font-family: var(--cyber-font);
            font-weight: bold;
            letter-spacing: 6px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            box-shadow: inset 0 0 12px rgba(0, 255, 204, 0.1);
        }
        .cyber-btn:active {
            background: rgba(0, 255, 204, 0.2);
            box-shadow: 0 0 20px var(--primary);
            transform: translateY(2px);
        }
        .cyber-btn.danger {
            border-color: var(--error);
            color: var(--error);
            box-shadow: inset 0 0 12px rgba(255, 51, 102, 0.1);
        }
        .cyber-btn.danger:active {
            background: rgba(255, 51, 102, 0.2);
            box-shadow: 0 0 20px var(--error);
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 5, 8, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-window {
            width: 88%;
            max-width: 400px;
            background: #0d0f16;
            border-radius: 12px;
            padding: 26px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.active .modal-window {
            transform: scale(1) translateY(0);
        }
        .modal-window.info-border { border: 2px solid var(--primary); box-shadow: 0 0 25px var(--primary-glow); }
        .modal-window.error-border { border: 2px solid var(--error); box-shadow: 0 0 25px var(--error-glow); }
        .modal-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-window.info-border .modal-header { color: var(--primary); }
        .modal-window.error-border .modal-header { color: var(--error); }
        .modal-body {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text);
            margin-bottom: 25px;
            text-align: center;
        }
        .cyber-input {
            width: 100%;
            background: #141722;
            border: 1px solid var(--border);
            padding: 14px 16px;
            border-radius: 6px;
            color: #fff;
            font-family: var(--cyber-font);
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
            text-align: center;
        }
        .cyber-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }
        .pin-display {
            font-size: 36px;
            letter-spacing: 12px;
            margin: 10px 0 20px 0;
            text-align: center;
            color: var(--primary);
            height: 45px;
            text-shadow: 0 0 15px var(--primary-glow);
        }
        .pin-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 280px;
            margin: 0 auto;
        }
        .pin-btn {
            background: #141722;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 16px;
            font-size: 20px;
            font-family: var(--cyber-font);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.1s;
        }
        .pin-btn:active {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 10px var(--primary);
        }
        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }
        .qr-img {
            width: 160px;
            height: 160px;
            border: 4px solid #fff;
            border-radius: 4px;
            display: none;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }
        .share-url-text {
            font-size: 11px;
            color: var(--primary);
            word-break: break-all;
            background: #090b10;
            padding: 8px;
            border-radius: 4px;
            width: 100%;
        }
        .loader {
            display: inline-block;
            width: 20px; height: 20px;
            border: 2px solid rgba(0,255,204,0.2);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="icon-btn" onclick="openShareModal()"><i class="fas fa-share-nodes"></i></button>
    </div>

    <div class="main-container">
        <div class="system-logo">
            <i class="fas fa-terminal"></i>
        </div>
        <h1>身份驗證終端</h1>
        <p class="subtitle">SECURITY VERIFICATION TERMINAL</p>
        <div class="btn-group">
            <button class="cyber-btn" onclick="handleSelection(true)">我是值星</button>
            <button class="cyber-btn danger" onclick="handleSelection(false)">我不是值星</button>
        </div>
    </div>

    <div id="alertModal" class="modal-overlay" onclick="closeModal(event, 'alertModal')">
        <div class="modal-window error-border">
            <div class="modal-header"><i class="fas fa-triangle-exclamation"></i> ACCESS DENIED</div>
            <div class="modal-body" id="alertMessage" style="font-size: 20px; font-weight: bold; letter-spacing: 2px;"></div>
            <div style="text-align: right;">
                <button class="cyber-btn" style="padding: 8px 24px; font-size:13px; letter-spacing:1px;" onclick="document.getElementById('alertModal').classList.remove('active')">關閉</button>
            </div>
        </div>
    </div>

    <div id="pinModal" class="modal-overlay" onclick="closeModal(event, 'pinModal')">
        <div class="modal-window info-border">
            <div class="modal-header"><i class="fas fa-lock"></i> ENTER SECURE PIN</div>
            <div class="modal-body">
                <div class="pin-display" id="pinDisplay"></div>
                <div class="pin-grid">
                    <button class="pin-btn" onclick="inputPin('1')">1</button>
                    <button class="pin-btn" onclick="inputPin('2')">2</button>
                    <button class="pin-btn" onclick="inputPin('3')">3</button>
                    <button class="pin-btn" onclick="inputPin('4')">4</button>
                    <button class="pin-btn" onclick="inputPin('5')">5</button>
                    <button class="pin-btn" onclick="inputPin('6')">6</button>
                    <button class="pin-btn" onclick="inputPin('7')">7</button>
                    <button class="pin-btn" onclick="inputPin('8')">8</button>
                    <button class="pin-btn" onclick="inputPin('9')">9</button>
                    <button class="pin-btn" style="color:var(--error);" onclick="inputPin('C')">C</button>
                    <button class="pin-btn" onclick="inputPin('0')">0</button>
                    <button class="pin-btn" style="color:var(--primary);" onclick="inputPin('E')">▶</button>
                </div>
            </div>
        </div>
    </div>

    <div id="textModal" class="modal-overlay" onclick="closeModal(event, 'textModal')">
        <div class="modal-window info-border">
            <div class="modal-header"><i class="fas fa-comment-code"></i> INITIALIZE COMMENT</div>
            <div class="modal-body">
                <input type="text" class="cyber-input" id="commentInput" placeholder="請輸入今日值星按語..." autocomplete="off">
                <button class="cyber-btn" style="width:100%; margin-top: 20px;" id="submitBtn" onclick="submitAndRedirect()">
                    <span id="btnText">封包建檔並前往 GOOGLE</span>
                </button>
            </div>
        </div>
    </div>

    <div id="shareModal" class="modal-overlay" onclick="closeModal(event, 'shareModal')">
        <div class="modal-window info-border">
            <div class="modal-header"><i class="fas fa-qrcode"></i> TERMINAL SHARE</div>
            <div class="modal-body">
                <div class="qr-section">
                    <button class="cyber-btn" style="width:100%; padding:10px; font-size:13px; letter-spacing:1px;" onclick="generateQr()">生成傳播連結與 QR 碼</button>
                    <img id="qrCodeImg" class="qr-img" src="" alt="QR Code">
                    <div id="shareUrlText" class="share-url-text" style="display:none;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let enteredPin = "";
        const CORRECT_PIN = "0720";

        function showAlert(msg) {
            document.getElementById('alertMessage').textContent = msg;
            document.getElementById('alertModal').classList.add('active');
        }

        function closeModal(e, id) {
            if(e.target === document.getElementById(id)) {
                document.getElementById(id).classList.remove('active');
            }
        }

        function handleSelection(isDuty) {
            if (isDuty) {
                enteredPin = "";
                document.getElementById('pinDisplay').textContent = "";
                document.getElementById('pinModal').classList.add('active');
            } else {
                window.location.href = "https://www.google.com";
            }
        }

        function inputPin(val) {
            const display = document.getElementById('pinDisplay');
            if (val === 'C') {
                enteredPin = "";
            } else if (val === 'E') {
                if (enteredPin === CORRECT_PIN) {
                    document.getElementById('pinModal').classList.remove('active');
                    document.getElementById('textModal').classList.add('active');
                } else {
                    document.getElementById('pinModal').classList.remove('active');
                    showAlert('不要亂！');
                    enteredPin = "";
                }
            } else {
                if (enteredPin.length < 4) enteredPin += val;
            }
            display.textContent = "•".repeat(enteredPin.length);
        }

        function submitAndRedirect() {
            const text = document.getElementById('commentInput').value.trim();
            if (!text) return;
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            document.getElementById('btnText').innerHTML = `<span class="loader"></span>DATA WRITING...`;
            
            setTimeout(() => {
                window.location.href = "https://www.google.com";
            }, 1000);
        }

        function openShareModal() {
            document.getElementById('qrCodeImg').style.display = 'none';
            document.getElementById('shareUrlText').style.display = 'none';
            document.getElementById('shareModal').classList.add('active');
        }

        function generateQr() {
            const currentUrl = window.location.href;
            const qrImg = document.getElementById('qrCodeImg');
            const urlText = document.getElementById('shareUrlText');
            
            qrImg.src = `https://quickchart.io/qr?text=${encodeURIComponent(currentUrl)}&size=160`;
            qrImg.style.display = 'block';
            urlText.textContent = currentUrl;
            urlText.style.display = 'block';
        }
    </script>
</body>
</html>
